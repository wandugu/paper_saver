  python: ${P24_REPO_ROOT}/.venv-p24-310/bin/python
  torch: 2.6.0+cu118
  transformers: 4.57.1
  formal_runs_root: ${P24_RUN_ROOT}/p24_phase5_pinned
  old_runs_preserved: ${P24_RUN_ROOT}/p24_phase5
  exclusions: repro/p24/phase5_runtime_exclusions.json
  cache: Preserve every existing file; newly added 5.15.0 cache files are excluded by exact path relative to the configured feature root and replaced only by newly created phase5-tf4571- prefixed files in the original namespace directory; original 4.57.1 cache remains reused. Count all new files from both attempts toward 10GB cap.
  unchanged_rules: All seeds, losses, dropout, delta1, thresholds, certificate formulas, split option b, go/no-go rules and launch deadlines remain exactly as preregistered. C1 then C2 then C3 are rerun on the pinned environment; old decisions have no selection authority.
